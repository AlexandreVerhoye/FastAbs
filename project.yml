name: Hara
options:
  bundleIdPrefix: com.alexandreverhoye
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  Hara:
    type: application
    platform: iOS
    sources:
      - Hara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexandreverhoye.Hara
        PRODUCT_NAME: Hara
        INFOPLIST_FILE: Hara/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets:
        - HaraTests
  HaraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HaraTests
    dependencies:
      - target: Hara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexandreverhoye.HaraTests
        GENERATE_INFOPLIST_FILE: true

