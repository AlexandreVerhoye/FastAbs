name: FastAbs
options:
  bundleIdPrefix: com.alexandreverhoye
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  FastAbs:
    type: application
    platform: iOS
    sources:
      - FastAbs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexandreverhoye.FastAbs
        PRODUCT_NAME: FastAbs
        INFOPLIST_FILE: FastAbs/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets:
        - FastAbsTests
  FastAbsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FastAbsTests
    dependencies:
      - target: FastAbs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexandreverhoye.FastAbsTests
        GENERATE_INFOPLIST_FILE: true

